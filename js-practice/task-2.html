<!DOCTYPE html>

  <head>

    <title>Task 2</title>
    <style>
      body {

        font-size: 20px;
        font-weight: bold;
        font-family: Arial;
      }

      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .button-style {
        border: none;
        padding: 10px 20px;
        margin-bottom: 8px;
        margin-right: 5px;
        border-radius: 5px;
      }

      .button-style:hover {
        background-color: rgb(40, 244, 47);
      }

      .enter-button {
        background-color: skyblue;
        padding: 6px 15px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <p>Select up to 6 Numbers</p>
    <p class="js-numbers number-style">000000</p>
    <div class="button-container">
      <div>
        <button
          onclick="
      numbersButton('0');
      quantityButton();
        "

        >
          0
        </button>
        <button
          onclick="
      numbersButton('1');
      quantityButton();
        "
          class="button-style"
        >

      </div>
      <div>

      </div>
      <div>

      numbersButton('4');

      </div>
      <div>

      numbersButton('6');
      quantityButton();
        "

          6
        </button>
        <button
          onclick="
      numbersButton('7');
      quantityButton();
        "
          class="button-style"
        >
          7
        </button>
      </div>
      <div>
        <button
          onclick="
      numbersButton('8');
      quantityButton();
        "
          class="button-style"
        >
          8
        </button>
        <button
          onclick="
      numbersButton('9');
      quantityButton();
        "
          class="button-style"
        >
          9
        </button>
      </div>
    </div>
    <button
      onclick="

     numbersButton(value);
     alert(`Even: ${property.even}, 0dd: ${property.odd}`);
 
 "
      class="enter-button"
    >
      Enter
    </button>
    <script>
      let property = {
        even: 0,
        odd: 0,
      };

      let numbers = "";

      let numbersQuantity = 1;

      function quantityButton() {
        if (numbersQuantity + 1 > 6) {
          alert("Select up to 6 Numbers");
        } else {
          numbersQuantity++;
        }
      }

      function numbersButton(value) {
        numbers += value;
        displayNumbers();

        let result = "";

        if (value === "0") {
          result = "even";
        } else if (value === "2") {
          result = "even";
        } else if (value === "4") {
          result = "even";
        } else if (value === "6") {
          result = "even";
        } else if (value === "8") {
          result = "even";
        } else if (value === "1") {
          result = "odd";
        } else if (value === "3") {
          result = "odd";
        } else if (value === "5") {
          result = "odd";
        } else if (value === "7") {
          result = "odd";
        } else if (value === "9") {
          result = "odd";
        }

        if (result === "even") {
          property.even += 1;
        } else if (result === "odd") {
          property.odd += 1;
        }
      }

      function displayNumbers() {
        document.querySelector(".js-numbers").innerHTML = numbers;
      }
    </script>
  </body>
</html>
