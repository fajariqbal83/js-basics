<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
    <style>
     
      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .button-style {
        border: none;
        padding: 10px 20px;
        margin-bottom: 8px;
        margin-right: 5px;
        border-radius: 5px;
      }

      .button-style:hover {
        background-color: rgb(40, 244, 47);
      }

    </style>
  </head>
  <body>
 <div class="button-container">
     <div>
      <button class="button-style">0</button>
      <button class="button-style">1</button>
     </div>
    <div>
      <button class="button-style">2</button>
      <button class="button-style">3</button>
    </div>
    <div>
      <button class="button-style">4</button>
      <button class="button-style">5</button>
    </div>
    <div>
      <button class="button-style">6</button>
      <button class="button-style">7</button>
    </div>
    <div>
      <button class="button-style">8</button>
      <button class="button-style">9</button>
    </div>
 </div>
    <script></script>
  </body>
</html>
