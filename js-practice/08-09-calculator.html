<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial;
        font-size: 30px;
        background-color: black;
        color: white;
      }
      .buttons-grey {
        background-color: grey;
        color: white;
        border: none;
       width: 50px;
       height: 50px;
        border-radius: 30px;
        font-size: 15px;
      }

      .button-yellow {
        background-color: rgb(250, 193, 7);
        color: white;
        border: none;
         width: 50px;
       height: 50px;
        border-radius: 30px;
        font-size: 15px;

      }

    </style>
  </head>
  <body>
  
    <p class="js-calculation"></p>

    <p>
      <button onclick="
        updateCalculation('1');
      " class="buttons-grey">1</button>

      <button onclick="
        updateCalculation('2');
      " class="buttons-grey">2</button>

      <button onclick="
        updateCalculation('3');
      " class="buttons-grey">3</button>

      <button onclick="
        updateCalculation(' + ');
      " class="button-yellow ">+</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('4');
      " class="buttons-grey">4</button>

      <button onclick="
        updateCalculation('5');
      " class="buttons-grey" >5</button>

      <button onclick="
        updateCalculation('6');
      " class="buttons-grey">6</button>

      <button onclick="
        updateCalculation(' - ');
      " class="button-yellow ">-</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('7');
      " class="buttons-grey">7</button>

      <button onclick="
        updateCalculation('8');
      " class="buttons-grey">8</button>

      <button onclick="
        updateCalculation('9');
      " class="buttons-grey">9</button>

      <button onclick="
        updateCalculation(' * ');
      " class="button-yellow ">*</button>
    </p>

    <p>
      <button onclick="
        updateCalculation('0');
      " class="buttons-grey">0</button>

      <button onclick="
        updateCalculation('.');
      " class="buttons-grey">.</button>

      <button onclick="
      
        calculation = eval(calculation);

        
        displayCalculation();

        localStorage.setItem('calculation', calculation);
      " class="buttons-grey">=</button>

      <button onclick="
        updateCalculation(' / ');
      " class="button-yellow ">/</button>
    </p>

    <p>
      <button onclick="
        calculation = '';

        displayCalculation();

        localStorage.setItem('calculation', calculation);
      " class="buttons-grey">Clear</button>
    </p>

    <script>
      let calculation = localStorage.getItem('calculation') || '';

     
      displayCalculation();

      function updateCalculation(value) {
        calculation += value;

      
        displayCalculation();

        localStorage.setItem('calculation', calculation);
      }

      function displayCalculation() {
        document.querySelector('.js-calculation')
          .innerHTML = calculation;
      }
    </script>
  </body>
</html>
